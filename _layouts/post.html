---
layout: default
---
<nav aria-label="breadcrumb">
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="/">Home</a></li>
		<li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
	</ol>
</nav>

<article>
	<h1>{{ page.title }}</h1>

	{% if page.author %}
	<p>By {{ page.author }}</p>
	{% endif %}

	<div>
		{{ content }}
	</div>

	{% if page.comments != false %}
	<hr>
	<script src="https://giscus.app/client.js" data-repo="Tridentu/tridentu2" data-repo-id="R_kgDOPWuvAg" data-category="Announcement Comments" data-category-id="DIC_kwDOPWuvAs4DLSE4" data-mapping="pathname" data-strict="0" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="bottom" data-theme="light_high_contrast" data-lang="en" crossorigin="anonymous" data-loading="lazy" async>
	</script>
	{% endif %}
</article>
