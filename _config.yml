###########
# site.url, site.title

title: 'Tridentu Linux'
description: "The official website for Tridentu 2 Linux."
author: "Aerodos12"

## note: 
#  use site.path in your templates to make it work for both protocols e.g. http and https
#  use site.url only inside the web feed template (e.g. requires full url incl. protocol)
url:  'https://tridentu.github.io'


########
# more settings

markdown: kramdown

sass:
  sass_dir: css
  style:    expanded

pages_excerpts: true
collections:
    changelogs:
        output: true

plugins:
  - jekyll-feed


exclude:
- README.md

giscus:
  repo: Tridentu/tridentu2
  repo_id: R_kgDOPWuvAg
  category: Announcement Comments
  category_id: DIC_kwDOPWuvAs4DLSE4
  mapping: pathname # optional, defaults to pathname
  theme: light_high_contrast
  loading: lazy


paginate: 2

safe: true
lsi: false

