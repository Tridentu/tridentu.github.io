- title: Caravel
  text: The Caravel Package Manager is  specifically built for Tridentu Linux. It features easy downloading and installation of packages (dotfiles included), Lua scripting (for hooks and installation scripts) and a simple manifest.
  image: images/caravel.png
  imageCaption: Caravel in action
  featureType: Package Manager
  variants: Universal
- title: AppImage Support
  text: Tridentu Linux comes with AppImage support out of the box like most distros. But there's more. It features not only support, but extensively features it too (a dedicated folder and launcher widget to be precise).
  image: images/AppImage.png
  imageCaption: An AppImage in action on Tridentu 2.
  featureType: Built-in Feature
  variants: GT+
- title: Elegant Desktop
  text: For elegance and usability, Tridentu 2K comes with an elegant and simple look and feel (similar to MacOS). If you want to change it, there are multiple themes for that across multiple distro variants.
  image: images/overview.png
  imageCaption: Tridentu 2K Light theme overview
  featureType: Built-in Feature
  variants: GT+
- title: Flatpak
  text: Tridentu-2K has Flatpak support out of the box. This also means that you have better control over what apps reside on your system - something that the CMR (Caravel Main Repository) and Ishimura (APT repository) could barely give you.
  image: images/flatpak.png
  imageCaption: Flatpak support in Discover
  featureType: Package Manager
  variants: GT+
- title: Documentation
  text: Tridentu 2K takes advantage of KDE's builtin Docbook functionality to give you the documentation that you need and deserve. There is also a wiki available for Tridentu 2 as well (since 1.5).
  image: images/documents.png
  imageCaption: Tridentu 2 Wiki
  featureType: Built-in feature
  variants: K Only
- title: TUI Installer
  text: Tridentu 2 comes with a TUI-based installer program that can be a great alternative on desktop flavors to the Calamares installer. This one is based on Void Linux's installer.
  image: images/tridentuinstall.png
  imageCaption: Tridentu TUI installer
  featureType: OS Installer
  variants: Universal
- title: Accessibility Support
  text: Tridentu 2 now has better accessibility support than ever. Need to run a braille reader/writer on CT? We support that. Need to hear the text? We support that. We also support different input methods on the K variant as well. The K and GT variants also come with Orca for graphical screen reading.
  image: images/accessible.png
  imageCaption: Universal accessibility support
  featureType: Built-in feature
  variants: Universal
- title: Dual Launchers
  text: Don't like Krunner? Have no fear! On Tridentu 2, all you have to do is just press <kbd>Alt + Space</kbd> to access Vicinae.
  image: images/vicinae.png
  imageCaption: Vicinae in action
  featureType: Built-in feature
  variants: GT+

